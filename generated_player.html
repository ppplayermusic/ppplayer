<html lang="en"><head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
      html {
        width: 100%;
        height: 100%;

        pointer-events: none;
      }

      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        pointer-events: inherit;
      }

      .embed-container iframe,
      .embed-container object,
      .embed-container embed {
        position: absolute;

        pointer-events: inherit;

    <title>Youtube Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"></head>

  <body>
    <div class="embed-container">
      <iframe id="Youtube631923933" frameborder="0" allowfullscreen="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" title="YouTube video player" width="160" height="90" src="https://www.youtube.com/embed/?autoplay=1&amp;mute=0&amp;cc_lang_pref=en&amp;cc_load_policy=1&amp;color=white&amp;controls=0&amp;disablekb=1&amp;enablejsapi=1&amp;fs=0&amp;hl=en&amp;iv_load_policy=1&amp;loop=0&amp;modestbranding=1&amp;origin=https%3A%2F%2Fppplayer.com&amp;widget_referrer=https%3A%2F%2Fppplayer.com&amp;playsinline=1&amp;rel=0&amp;widgetid=1&amp;forigin=https%3A%2F%2Fppplayer.com%2F&amp;aoriginsup=1&amp;vf=6"></iframe>
    </div>

    <script type="text/javascript" id="www-widgetapi-script" src="https://www.youtube.com/s/player/f572e43c/www-widgetapi.vflset/www-widgetapi.js" async=""></script><script src="https://www.youtube.com/iframe_api"></script><script>
      var tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName("script")[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      var platform = "ios";
      var host = "https://www.youtube.com";
      var player;
      var timerId;

      function onYouTubeIframeAPIReady() {
        var pv = {"autoplay":1,"mute":0,"cc_lang_pref":"en","cc_load_policy":1,"color":"white","controls":0,"disablekb":1,"enablejsapi":1,"fs":0,"hl":"en","iv_load_policy":1,"loop":0,"modestbranding":"1","origin":"https://ppplayer.com","widget_referrer":"https://ppplayer.com","playsinline":1,"rel":0};
        player = new YT.Player("Youtube631923933", {
          host: host,
          playerVars: pv,
          events: {
            onReady: function (event) {
              handleFullScreenForMobilePlatform();
              sendMessage('Ready', event);
            },
            onStateChange: function (event) {
              clearTimeout(timerId);
              sendMessage('StateChange', event.data);
              if (event.data == 1) {
                timerId = setInterval(function () {
                  var state = {
                    'currentTime': player.getCurrentTime(),
                    'loadedFraction': player.getVideoLoadedFraction()
                  };

                  sendMessage('VideoState', JSON.stringify(state));
                }, 100);
              }
            },
            onPlaybackQualityChange: function (event) {
              sendMessage('PlaybackQualityChange', event.data);
            },
            onPlaybackRateChange: function (event) {
              sendMessage('PlaybackRateChange', event.data);
            },
            onApiChange: function (event) {
              sendMessage('ApiChange', event.data);
            },
            onError: function (event) {
              sendMessage('PlayerError', event.data);
            },
            onAutoplayBlocked: function (event) {
              sendMessage('AutoplayBlocked', event.data);
            },
          },
        });
        if (player && typeof player.setSize === 'function') {
          player.setSize(window.innerWidth, window.innerHeight);
        }
      }

      window.addEventListener('message', (event) => {
        try {
          var data = JSON.parse(event.data);

          if(data.function){
            var rawFunction = data.function.replaceAll('<<quote>>', '"');
            var result = eval(rawFunction);

            if(data.key) {
              var message = {}
              message[data.key] = result
              var messageString = JSON.stringify(message);

              event.source.postMessage(messageString , '*');
            }
          }
        } catch (e) {
          console.error("[YT] bridge error:", e);
        }
      }, false);

      window.onresize = function () {
        if (player && typeof player.setSize === 'function') {
          player.setSize(window.innerWidth, window.innerHeight);
        }
      };

      function sendPlatformMessage(message) {
        switch(platform) {
           case 'android':
           case 'ios':
           case 'macos':
             if (typeof Youtube631923933 !== 'undefined') {
               Youtube631923933.postMessage(message);
             } else if (window.Youtube631923933) {
               window.Youtube631923933.postMessage(message);
             }
             break;
           case 'web':
             window.parent.postMessage(message, '*');
             break;
         }
      }

      function sendMessage(key, data) {
         var message = {};
         message[key] = data;
         message['playerId'] = 'Youtube631923933';
         var messageString = JSON.stringify(message);

         sendPlatformMessage(messageString);
      }

      function getVideoData() {
        return prepareDataForPlatform(player.getVideoData());
      }

      function getPlaylist() {
        return prepareDataForPlatform(player.getPlaylist());
      }

      function getAvailablePlaybackRates(){
        return prepareDataForPlatform(player.getAvailablePlaybackRates());
      }

      function prepareDataForPlatform(data) {
        if(platform == 'android') return data;

        return JSON.stringify(data);
      }

      function handleFullScreenForMobilePlatform() {
        // Cross-origin DOM access intentionally removed to prevent SecurityError
        // which would abort onReady before the bridge handshake completes.
        // Fullscreen is handled via the allowfullscreen attribute on the iframe.
      }
    </script>
  

</body></html>
