name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          submodules: recursive

      - name: Download Artifacts from App Repo
        run: |
          mkdir -p release-assets
          cd release-assets
          # Download assets from the app repository release for this tag
          gh release download ${{ github.ref_name }} --repo ppplayermusic/app
          
          if [ ! -f "PPPlayer-Android.apk" ]; then
             echo "::error::Android APK artifact is missing from app repo release!"
             exit 1
          fi
          if [ ! -f "PPPlayer-macOS.zip" ]; then
             echo "::error::macOS ZIP artifact is missing from app repo release!"
             exit 1
          fi
          
          # Generate new checksums for downloaded files
          shasum -a 256 * > checksums.txt
          cat checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#v}"
          
          awk -v ver="\\[$TAG_VERSION\\]" '
            $0 ~ "^## " ver { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md > extracted_notes.md
          
          cat extracted_notes.md

      - name: Determine Prerelease Flag
        id: prerelease_check
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: extracted_notes.md
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
          make_latest: ${{ steps.prerelease_check.outputs.make_latest }}
          generate_release_notes: true
          files: |
            release-assets/*
